<!-- layout.component.html -->
<div class="layout-image-container">
  <img
    src="https://t3.ftcdn.net/jpg/08/71/60/32/360_F_871603234_fTMmjlUOpt4F9mDudj8wjyzkt0khEtSZ.jpg"
    alt="Layout Image"
    class="layout-image"
  />

   <form class="form-overlay" [formGroup]="trainigForm" (ngSubmit)="onSubmit()">
<div class="training">
 <label for="trainingType">Training Type</label>
</div> 
<select id="trainingType" name="trainingType">
    @for (item of trainingType; track $index) {
        <option [value]="item?.value">{{item?.name}}</option>
    }
      <!-- <option value="">Select Training Type</option>
      <option value="frontend">Frontend</option>
      <option value="backend">Backend</option>
      <option value="fullstack">Fullstack</option> -->
    </select>

    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your name" />

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" />

    <button type="submit">Submit</button>
  </form>

<section class="our_courses">
<div class="container">
    <div class="row">
        @for (item of courses; track $index) {
    <div class="col-xs-12 col-sm-6 col-md-3 mb-4">
  <div class="course-card text-center">
          <img [src]="item?.course_img" alt="angular" class="img-fluid mb-2"/>
          <h5>{{item?.course_name}}</h5>
        </div>
        </div>
        }
    </div>
</div>
</section>
