<div class="container py-5" *ngIf="showForm" @slideFadeIn>
    <div class="card shadow-lg rounded">
      <div class="card-header bg-secondary text-white">
        <h4 class="mb-0">User Information</h4>
      </div>
      <div class="card-body">
        <form [formGroup]="userInfo" (ngSubmit)="onSubmit($event)">
          <div class="mb-3">
            <label for="firstName" class="form-label">Enter First Name</label>
            <input type="text" id="firstName" class="form-control" formControlName="firstName" placeholder="Enter First Name" />
          </div>
  
          <div class="mb-3">
            <label for="lastName" class="form-label">Enter Last Name</label>
            <input type="text" id="lastName" class="form-control" formControlName="lastName"  placeholder="Enter Last Name" />
          </div>
  
          <div class="mb-4">
            <label for="phoneNumber" class="form-label">Enter Phone Number</label>
            <input type="text" id="phoneNumber" class="form-control" formControlName="phoneNo"   placeholder="Enter Phone Number" />
          </div>
  
          <button type="submit" class="btn bg-secondary w-100 text-white">Submit</button>
        </form>
      </div>
    </div>
  </div>
