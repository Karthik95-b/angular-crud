<div class="container mt-5 pt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow rounded-4">
        <div class="card-body">
          <h4 class="mb-4 text-center">Registration Form</h4>
          <form class=" p-4" [formGroup]="stdRegister" (ngSubmit)="studentRegister()">
            <div class="mb-3">
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" class="form-control" id="firstName" formControlName="firstName" placeholder="Enter first name">
         
          </div>
            <div class="mb-3">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" class="form-control" id="lastName" formControlName="lastName" placeholder="Enter last name">
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" placeholder="Enter email" formControlName="email">
            </div>

            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="tel" class="form-control" id="phone" placeholder="Enter phone number" formControlName="phno">
            </div>

              <div class="mb-3">
              <label for="phone" class="form-label">Date of birth</label>
              <input  type="date"
    class="form-control"
    id="dob"
    placeholder="Enter date of birth"
    formControlName="dob" (change)="calculateAge()">
            </div>


            <div class="mb-3">
              <label for="age" class="form-label">Age</label>
              <input type="number" class="form-control" id="age" placeholder="Enter age" formControlName="age"     readonly
>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <button type="submit" class="btn btn-primary">Register</button>
              <button  class="btn btn-primary" (click)="setFormValues()">Set Values</button>
              <button type="reset" class="btn btn-secondary">Reset</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
