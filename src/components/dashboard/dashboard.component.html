<div class="d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-lg p-4" style="width: 90%; max-width: 1000px;">
    <h3 class="text-center mb-4">User Details</h3>
    <table class="table table-bordered table-hover text-center">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>DOB</th>
          <th>Age</th>
        </tr>
      </thead>
      <tbody>
        @for (user of userList; track $index) {
            <tr>
          <td>{{ $index + 1 }}</td>
          <td>{{ user.firstName }}</td>
          <td>{{ user.lastName }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.phno }}</td>
          <td>{{ user.dob }}</td>
          <td>{{ user.age }}</td>
        </tr>
    }
      </tbody>
    </table>
  </div>
</div>
